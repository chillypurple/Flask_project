<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
{%with messages=get_flashed_messages()%}
{%if messages%}
<div id="flash-message">
{{messages[0]}}
</div>
{%endif%}
{%endwith%}

<body>
<h2>Login Account</h2>
<form action="/login"
method="POST">
<input type="text"
name="username"placeholder=
"Username"id="username">
<br><br>
<input type="password"
id="password"name="password"
placeholder="Password">
<br><br>
<button type="submit">
Login</button>
</form>

<p>
<h2>Dont have you an Account?</h2>
<a href="/register">
Register</a>
</p>
<style>
div{
    background:blue;
    color:yellow;
    padding:10px;
    margin:10px;
    border-radius:20px;
    text-align:center;
    
}

</style>


<script src="/static/login.js"></script>

</body>
</html>
